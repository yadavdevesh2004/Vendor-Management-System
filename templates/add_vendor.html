{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-5">
        <div class="card p-4">
            <h4 class="fw-bold mb-3"><i class="fa-solid fa-user-plus me-2 text-primary"></i>Add New Vendor</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Vendor / Company Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Apex Traders" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control" placeholder="vendor@example.com" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Contact Phone</label>
                    <input type="tel" name="phone" class="form-control" placeholder="+91 9876543210" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" name="category" placeholder="e.g. Spare Parts, Lubricants" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Save Vendor</button>
            </form>
        </div>
    </div>
    <div class="col-md-7">
        <div class="card p-4">
            <h4 class="fw-bold mb-3"><i class="fa-solid fa-users me-2 text-info"></i>Existing Vendors</h4>
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Category</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for v in vendors %}
                        <tr>
                            <td><strong>{{ v.name }}</strong></td>
                            <td>{{ v.email }}</td>
                            <td><span class="badge bg-secondary">{{ v.category }}</span></td>
                            <td class="text-center">
                                <a href="{{ url_for('delete_vendor', id=v.id) }}" 
                                   class="btn btn-outline-danger btn-sm"
                                   onclick="return confirm('Are you sure you want to delete this vendor?');">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        {% else %}
                        <tr><td colspan="4" class="text-center text-muted">No vendors added yet.</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
