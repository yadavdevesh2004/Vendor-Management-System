{% extends "base.html" %}
{% block content %}
<div class="row">
    <div class="col-md-4">
        <div class="card p-4">
            <h4 class="fw-bold mb-3"><i class="fa-solid fa-box-open me-2 text-primary"></i>Add Product</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Product Name</label>
                    <input type="text" name="name" class="form-control" placeholder="e.g. Synthetic Oil 5L" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Category</label>
                    <input type="text" name="category" class="form-control" placeholder="e.g. Lubricants" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Base Estimate Price (₹)</label>
                    <input type="number" step="0.01" name="base_price" class="form-control" placeholder="500.00" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 py-2">Add Product</button>
            </form>
        </div>
    </div>
    <div class="col-md-8">
        <div class="card p-4">
            <h4 class="fw-bold mb-3"><i class="fa-solid fa-boxes-stacked me-2 text-info"></i>Available Catalog</h4>
            <div class="table-responsive" style="max-height: 420px; overflow-y: auto;">
                <table class="table table-hover align-middle">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Product Name</th>
                            <th>Category</th>
                            <th>Base Price</th>
                            <th class="text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for p in products %}
                        <tr>
                            <td>{{ p.id }}</td>
                            <td><strong>{{ p.name }}</strong></td>
                            <td>{{ p.category }}</td>
                            <td>₹ {{ "%.2f"|format(p.base_price) }}</td>
                            <td class="text-center">
                                <a href="{{ url_for('delete_product', id=p.id) }}" 
                                   class="btn btn-outline-danger btn-sm"
                                   onclick="return confirm('Are you sure you want to delete this product?');">
                                    <i class="fa-solid fa-trash"></i>
                                </a>
                            </td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
