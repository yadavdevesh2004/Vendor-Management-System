{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4">
            <h4 class="fw-bold mb-3">Upload / Submit Quotation</h4>
            <form method="POST">
                <div class="mb-3">
                    <label class="form-label">Select Vendor</label>
                    <select name="vendor_id" class="form-select" required>
                        <option value="">-- Choose Vendor --</option>
                        {% for v in vendors %}
                        <option value="{{ v.id }}">{{ v.name }} ({{ v.category }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Select Product</label>
                    <select name="product_id" class="form-select" required>
                        <option value="">-- Choose Product --</option>
                        {% for p in products %}
                        <option value="{{ p.id }}">{{ p.name }} (Base: ₹{{ p.base_price }})</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Quoted Price per Unit (₹)</label>
                        <input type="number" step="0.01" name="quoted_price" class="form-control" required>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Delivery Lead Time (Days)</label>
                        <input type="number" name="delivery_days" class="form-control" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary w-100">Submit Quotation</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
